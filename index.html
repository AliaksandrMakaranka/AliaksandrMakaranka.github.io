(function () {
  var buttons = document.querySelectorAll('[data-set-lang]');
  function setLang(lang, remember) {
    if (!T[lang]) lang = 'pl';
    var d = T[lang];
    document.documentElement.lang = lang;
    document.title = d.title;
    document.querySelectorAll('[data-i]').forEach(function (el) {
      var v = d[el.getAttribute('data-i')];
      if (v !== undefined) el.textContent = v;
    });
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)); });
    if (remember) { try { localStorage.setItem('lang', lang); } catch (e) {} }
  }
  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      setLang(b.dataset.setLang, true);
      try { history.replaceState(null, '', '?lang=' + b.dataset.setLang + location.hash); } catch (e) {}
    });
  });
  var fromUrl = new URLSearchParams(location.search).get('lang');
  var saved = null; try { saved = localStorage.getItem('lang'); } catch (e) {}
  var nav = (navigator.language || 'pl').slice(0, 2).toLowerCase();
  var guess = nav === 'pl' ? 'pl' : (['ru', 'uk', 'be'].indexOf(nav) >= 0 ? 'ru' : (nav === 'en' ? 'en' : 'pl'));
  setLang(fromUrl || saved || guess, false);
})();
